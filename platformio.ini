; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
board = nucleo_f446re
framework = cmsis
build_flags = 
  -mfpu=fpv4-sp-d16
  -mfloat-abi=softfp

[env:nucleo_f446re]
build_src_filter =
  -<*>
  +<rtos/>
  +<demos/common/>
  +<demos/showcase/>

[env:nucleo_f446re_priority]
build_src_filter =
  -<*>
  +<rtos/>
  +<demos/common/>
  +<demos/priority/>

[env:nucleo_f446re_mutex]
build_src_filter =
  -<*>
  +<rtos/>
  +<demos/common/>
  +<demos/mutex/>

[env:nucleo_f446re_test]
test_framework = unity
test_build_src = yes
test_speed = 115200
build_src_filter =
  -<*>
  +<rtos/>

[platformio]
default_envs = nucleo_f446re
